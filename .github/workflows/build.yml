name: Build custom_fakelag

on:
  push:
    branches:
      - main
      - master
      - develop
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: custom-fakelag-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deps-smx:
    runs-on: ubuntu-22.04
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 zip make

      - name: Resolve dependency cache key
        id: cache-key
        shell: bash
        run: |
          echo "key=smx-deps-${{ runner.os }}-${{ hashFiles('scripts/deps/fetch-plugin-deps.py', 'scripts/build/build-plugins.py', 'scripts/package/copy-tree.py', 'scripts/package/stage-artifact.py', 'scripts/package/package-release.py', 'scripts/package/package-map.json', 'Makefile') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: deps-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .deps/smx
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch plugin build dependencies
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        shell: bash
        run: make deps-smx

      - name: Save dependency cache
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/smx
          key: ${{ steps.cache-key.outputs.key }}

  build-smx:
    runs-on: ubuntu-22.04
    needs: deps-smx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 zip make

      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: .deps/smx
          key: ${{ needs.deps-smx.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build SMX package
        shell: bash
        run: make build-smx

      - name: Check shutdown evidence exporter and compile opt-in consumers
        shell: bash
        run: make test-consumers
      - name: Upload SMX build tree
        uses: actions/upload-artifact@v7
        with:
          name: smx-build
          path: .build/plugins
          if-no-files-found: error
          retention-days: 1

  deps-exts-linux:
    runs-on: ubuntu-22.04
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv make gcc-multilib g++-multilib clang zip

      - name: Resolve dependency cache key
        id: cache-key
        shell: bash
        run: |
          echo "key=exts-linux-deps-${{ runner.os }}-${{ hashFiles('scripts/deps/fetch-linux-deps.sh', 'scripts/build/build-linux-l4d2.sh', 'scripts/package/package-map.json', 'Makefile', 'configure.py', 'AMBuildScript', 'AMBuilder', 'PackageScript') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: deps-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .deps/exts-linux
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch Linux extension dependencies
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        shell: bash
        run: make deps-exts-linux

      - name: Save dependency cache
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/exts-linux
          key: ${{ steps.cache-key.outputs.key }}

  build-exts-linux:
    runs-on: ubuntu-22.04
    needs: deps-exts-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv make gcc-multilib g++-multilib clang zip

      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: .deps/exts-linux
          key: ${{ needs.deps-exts-linux.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run Linux regression tests with sanitizers
        shell: bash
        run: TEST_ARCH=32 SANITIZE=1 make test-exts-linux

      - name: Build Linux extension package
        shell: bash
        run: make build-exts-linux

      - name: Build and test independent Steam lifecycle diagnostic
        shell: bash
        run: make test-diagnostic-linux
      - name: Upload Linux diagnostic separately
        uses: actions/upload-artifact@v7
        with:
          name: steam-lifecycle-debug-linux
          path: .build/steam-debug/diagnostics/steam_lifecycle_debug/package
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux extension build tree
        uses: actions/upload-artifact@v7
        with:
          name: exts-build-linux
          path: .build/linux-l4d2/package
          if-no-files-found: error
          retention-days: 1

  deps-exts-windows:
    runs-on: windows-2022
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve dependency cache key
        id: cache-key
        shell: bash
        run: |
          echo "key=exts-windows-deps-${{ runner.os }}-${{ hashFiles('scripts/deps/fetch-windows-deps.ps1', 'scripts/build/build-windows-l4d2.ps1', 'scripts/package/package-map.json', 'Makefile', 'configure.py', 'AMBuildScript', 'AMBuilder', 'PackageScript') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: deps-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .deps/exts-windows
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch Windows extension dependencies
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        shell: pwsh
        run: make deps-exts-windows

      - name: Save dependency cache
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/exts-windows
          key: ${{ steps.cache-key.outputs.key }}

  build-exts-windows:
    runs-on: windows-2022
    needs: deps-exts-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: .deps/exts-windows
          key: ${{ needs.deps-exts-windows.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run Windows regression tests
        shell: pwsh
        run: make test-exts-windows

      - name: Compile Windows SDK contract harness
        shell: pwsh
        run: make test-sdk-windows

      - name: Verify real Windows exit collection including DLL detach
        shell: pwsh
        run: make test-collection-windows
      - name: Build Windows extension package
        shell: pwsh
        run: make build-exts-windows

      - name: Build and test independent Steam lifecycle diagnostic
        shell: pwsh
        run: make test-diagnostic-windows
      - name: Upload Windows diagnostic separately
        uses: actions/upload-artifact@v7
        with:
          name: steam-lifecycle-debug-windows
          path: .build/steam-debug/diagnostics/steam_lifecycle_debug/package
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows extension build tree
        uses: actions/upload-artifact@v7
        with:
          name: exts-build-windows
          path: .build/windows-l4d2/package
          if-no-files-found: error
          retention-days: 1

  release-linux:
    runs-on: ubuntu-22.04
    needs: [build-smx, build-exts-linux]
    outputs:
      basename: ${{ steps.meta.outputs.basename }}
      release-tag: ${{ steps.meta.outputs.release_tag }}
      release-name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 zip make

      - name: Download SMX build tree
        uses: actions/download-artifact@v8
        with:
          name: smx-build
          path: .build/plugins

      - name: Download Linux extension build tree
        uses: actions/download-artifact@v8
        with:
          name: exts-build-linux
          path: .build/linux-l4d2/package

      - name: Resolve Linux artifact metadata
        id: meta
        shell: bash
        run: make release-identity-linux

      - name: Package Linux trees
        shell: bash
        run: |
          make package-smx
          make package-exts-linux

      - name: Build Linux release archive
        shell: bash
        run: make release-linux validate-artifact-linux LINUX_RELEASE_BASENAME="${{ steps.meta.outputs.basename }}"

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.basename }}
          path: dist/release/${{ steps.meta.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

  release-windows:
    runs-on: windows-2022
    needs: [build-smx, build-exts-windows]
    outputs:
      basename: ${{ steps.meta.outputs.basename }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download SMX build tree
        uses: actions/download-artifact@v8
        with:
          name: smx-build
          path: .build/plugins

      - name: Download Windows extension build tree
        uses: actions/download-artifact@v8
        with:
          name: exts-build-windows
          path: .build/windows-l4d2/package

      - name: Resolve Windows artifact metadata
        id: meta
        shell: bash
        run: make release-identity-windows

      - name: Package Windows trees
        shell: pwsh
        run: |
          make package-smx
          make package-exts-windows

      - name: Build Windows release archive
        shell: pwsh
        run: make release-windows validate-artifact-windows WINDOWS_RELEASE_BASENAME="${{ steps.meta.outputs.basename }}"

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.basename }}
          path: dist/release/${{ steps.meta.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: [release-linux, release-windows]
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'develop' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Linux release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-linux.outputs.basename }}
          path: dist/release

      - name: Download Windows release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-windows.outputs.basename }}
          path: dist/release

      - name: Move channel tag
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ needs.release-linux.outputs.release-tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ needs.release-linux.outputs.release-tag }}" --force

      - name: Publish channel release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ needs.release-linux.outputs.release-tag }}"
          title="${{ needs.release-linux.outputs.release-name }}"
          linux_asset="dist/release/${{ needs.release-linux.outputs.basename }}.zip"
          windows_asset="dist/release/${{ needs.release-windows.outputs.basename }}.zip"

          test -s "$linux_asset"
          test -s "$windows_asset"
          gh release list --limit 1 >/dev/null
          notes="$RUNNER_TEMP/channel-notes.md"
          printf 'Actualización %s.\nFecha UTC: %s\nCommit: %s\nCI: %s/%s/actions/runs/%s (intento %s)\n' "$title" "$(date -u +%FT%TZ)" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" --title "$title" --draft --target "$GITHUB_SHA" --notes-file "$notes"
          gh release upload "$tag" "$linux_asset" "$windows_asset"
          if [[ "${{ needs.release-linux.outputs.prerelease }}" == "true" ]]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --draft=false --prerelease=false --latest
          fi
