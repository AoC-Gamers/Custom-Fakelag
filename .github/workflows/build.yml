name: Build custom_fakelag

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: custom-fakelag-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deps-smx:
    runs-on: ubuntu-22.04
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 zip make

      - name: Resolve dependency cache key
        id: cache-key
        shell: bash
        run: |
          echo "key=smx-deps-${{ runner.os }}-${{ hashFiles('scripts/fetch-plugin-deps.py', 'scripts/build-plugins.py', 'scripts/copy-tree.py', 'scripts/stage-artifact.py', 'scripts/package-release.py', 'plugin-package-map.json', 'Makefile') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: deps-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .deps/smx
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch plugin build dependencies
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        shell: bash
        run: make deps-smx

      - name: Save dependency cache
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/smx
          key: ${{ steps.cache-key.outputs.key }}

  build-smx:
    runs-on: ubuntu-22.04
    needs: deps-smx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 zip make

      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: .deps/smx
          key: ${{ needs.deps-smx.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build SMX package
        shell: bash
        run: make build-smx

      - name: Check shutdown evidence exporter and compile opt-in consumers
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p test_windows_shutdown_export.py
          python3 -m unittest discover -s tests -p test_windows_steam_debug_tools.py
          compiler=.deps/smx/sourcemod-package/addons/sourcemod/scripting/spcomp
          includes=.deps/smx/sourcemod-package/addons/sourcemod/scripting/include
          mkdir -p .build/shutdown-consumers
          for consumer in windows_shutdown_consumer windows_shutdown_fill_consumer; do
            "$compiler" "tests/$consumer.sp" -iscripting/include -i"$includes" -o".build/shutdown-consumers/$consumer.smx"
          done

      - name: Upload SMX build tree
        uses: actions/upload-artifact@v7
        with:
          name: smx-build
          path: .build/plugins
          if-no-files-found: error
          retention-days: 1

  deps-exts-linux:
    runs-on: ubuntu-22.04
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv make gcc-multilib g++-multilib clang zip

      - name: Resolve dependency cache key
        id: cache-key
        shell: bash
        run: |
          echo "key=exts-linux-deps-${{ runner.os }}-${{ hashFiles('scripts/fetch-linux-deps.sh', 'scripts/build-linux-l4d2.sh', 'plugin-package-map.json', 'Makefile', 'configure.py', 'AMBuildScript', 'AMBuilder', 'PackageScript') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: deps-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .deps/exts-linux
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch Linux extension dependencies
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        shell: bash
        run: make deps-exts-linux

      - name: Save dependency cache
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/exts-linux
          key: ${{ steps.cache-key.outputs.key }}

  build-exts-linux:
    runs-on: ubuntu-22.04
    needs: deps-exts-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv make gcc-multilib g++-multilib clang zip

      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: .deps/exts-linux
          key: ${{ needs.deps-exts-linux.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run Linux regression tests with sanitizers
        shell: bash
        run: TEST_ARCH=32 SANITIZE=1 make test-exts-linux

      - name: Build Linux extension package
        shell: bash
        run: make build-exts-linux

      - name: Build and test independent Steam lifecycle diagnostic
        shell: bash
        run: |
          root="$PWD"
          deps="$root/.deps/exts-linux"
          python="$deps/.venv-linux/bin/python"
          mkdir -p .build/steam-debug/test-data
          g++ -m32 -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer diagnostics/steam_lifecycle_debug/tests.cpp -o .build/steam-debug/tests
          .build/steam-debug/tests .build/steam-debug/test-data
          cd .build/steam-debug
          "$python" "$root/configure.py" --sdks l4d2 --hl2sdk-root "$deps" --mms-path "$deps/mmsource-1.12" --sm-path "$deps/sourcemod-1.12" --enable-optimize --steam-lifecycle-debug
          "$python" -c 'import sys; from ambuild2.run import cli_run; sys.exit(cli_run())'

      - name: Upload Linux diagnostic separately
        uses: actions/upload-artifact@v7
        with:
          name: steam-lifecycle-debug-linux
          path: .build/steam-debug/diagnostics/steam_lifecycle_debug/package
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux extension build tree
        uses: actions/upload-artifact@v7
        with:
          name: exts-build-linux
          path: .build/linux-l4d2/package
          if-no-files-found: error
          retention-days: 1

  deps-exts-windows:
    runs-on: windows-2022
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve dependency cache key
        id: cache-key
        shell: bash
        run: |
          echo "key=exts-windows-deps-${{ runner.os }}-${{ hashFiles('scripts/fetch-windows-deps.ps1', 'scripts/build-windows-l4d2.ps1', 'plugin-package-map.json', 'Makefile', 'configure.py', 'AMBuildScript', 'AMBuilder', 'PackageScript') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: deps-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .deps/exts-windows
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch Windows extension dependencies
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        shell: pwsh
        run: make deps-exts-windows

      - name: Save dependency cache
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/exts-windows
          key: ${{ steps.cache-key.outputs.key }}

  build-exts-windows:
    runs-on: windows-2022
    needs: deps-exts-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: .deps/exts-windows
          key: ${{ needs.deps-exts-windows.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run Windows regression tests
        shell: pwsh
        run: make test-exts-windows

      - name: Compile Windows SDK contract harness
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-windows-sdk-contract.ps1 -BuildOnly

      - name: Verify real Windows exit collection including DLL detach
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC toolchain not found' }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvarsall.bat'
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          $private = Join-Path $env:RUNNER_TEMP 'shutdown-collection'
          pwsh -NoProfile -File scripts/test-windows-shutdown-collection.ps1 -PrivateDirectory $private -Python $python -VcVars $vcvars

      - name: Build Windows extension package
        shell: pwsh
        run: make build-exts-windows

      - name: Build and test independent Steam lifecycle diagnostic
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC toolchain not found' }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvarsall.bat'
          $environment = cmd /c """$vcvars"" x86 >nul && set"
          if ($LASTEXITCODE) { throw 'MSVC x86 initialization failed' }
          foreach ($line in $environment) {
            if ($line -match '^(.*?)=(.*)$') { [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process') }
          }
          $root = (Get-Location).Path
          $deps = Join-Path $root '.deps\exts-windows'
          $python = Join-Path $deps '.venv-windows\Scripts\python.exe'
          $build = Join-Path $root '.build\steam-debug'
          New-Item -ItemType Directory -Force (Join-Path $build 'test-data') | Out-Null
          Push-Location $build
          try {
            & cl /nologo /std:c++14 /EHsc /W4 /D_CRT_SECURE_NO_WARNINGS "$root\diagnostics\steam_lifecycle_debug\tests.cpp" /Fe:tests.exe /link advapi32.lib
            if ($LASTEXITCODE) { throw 'Diagnostic fixture compilation failed' }
            & .\tests.exe (Join-Path $build 'test-data')
            if ($LASTEXITCODE) { throw 'Diagnostic fixture failed' }
            & $python "$root\configure.py" --sdks l4d2 --hl2sdk-root $deps --mms-path "$deps\mmsource-1.12" --sm-path "$deps\sourcemod-1.12" --enable-optimize --steam-lifecycle-debug
            if ($LASTEXITCODE) { throw 'Diagnostic configuration failed' }
            & $python -c 'import sys; from ambuild2.run import cli_run; sys.exit(cli_run())'
            if ($LASTEXITCODE) { throw 'Diagnostic build failed' }
          } finally { Pop-Location }

      - name: Upload Windows diagnostic separately
        uses: actions/upload-artifact@v7
        with:
          name: steam-lifecycle-debug-windows
          path: .build/steam-debug/diagnostics/steam_lifecycle_debug/package
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows extension build tree
        uses: actions/upload-artifact@v7
        with:
          name: exts-build-windows
          path: .build/windows-l4d2/package
          if-no-files-found: error
          retention-days: 1

  release-linux:
    runs-on: ubuntu-22.04
    needs: [build-smx, build-exts-linux]
    outputs:
      basename: ${{ steps.meta.outputs.basename }}
      release-tag: ${{ steps.meta.outputs.release_tag }}
      release-name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 zip make

      - name: Download SMX build tree
        uses: actions/download-artifact@v8
        with:
          name: smx-build
          path: .build/plugins

      - name: Download Linux extension build tree
        uses: actions/download-artifact@v8
        with:
          name: exts-build-linux
          path: .build/linux-l4d2/package

      - name: Resolve Linux artifact metadata
        id: meta
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            main|master)
              echo "basename=custom-fakelag-linux-latest" >> "$GITHUB_OUTPUT"
              echo "release_tag=channel/latest" >> "$GITHUB_OUTPUT"
              echo "release_name=Latest" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
            develop)
              echo "basename=custom-fakelag-linux-develop" >> "$GITHUB_OUTPUT"
              echo "release_tag=channel/develop" >> "$GITHUB_OUTPUT"
              echo "release_name=Develop" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "basename=custom-fakelag-linux-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
              echo "release_tag=" >> "$GITHUB_OUTPUT"
              echo "release_name=" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Package Linux trees
        shell: bash
        run: |
          make package-smx
          make package-exts-linux

      - name: Build Linux release archive
        shell: bash
        run: make release-linux LINUX_RELEASE_BASENAME="${{ steps.meta.outputs.basename }}"

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.basename }}
          path: dist/release/${{ steps.meta.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

  release-windows:
    runs-on: windows-2022
    needs: [build-smx, build-exts-windows]
    outputs:
      basename: ${{ steps.meta.outputs.basename }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download SMX build tree
        uses: actions/download-artifact@v8
        with:
          name: smx-build
          path: .build/plugins

      - name: Download Windows extension build tree
        uses: actions/download-artifact@v8
        with:
          name: exts-build-windows
          path: .build/windows-l4d2/package

      - name: Resolve Windows artifact metadata
        id: meta
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            main|master)
              echo "basename=custom-fakelag-windows-latest" >> "$GITHUB_OUTPUT"
              ;;
            develop)
              echo "basename=custom-fakelag-windows-develop" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "basename=custom-fakelag-windows-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Package Windows trees
        shell: pwsh
        run: |
          make package-smx
          make package-exts-windows

      - name: Build Windows release archive
        shell: pwsh
        run: make release-windows WINDOWS_RELEASE_BASENAME="${{ steps.meta.outputs.basename }}"

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.basename }}
          path: dist/release/${{ steps.meta.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    runs-on: ubuntu-22.04
    needs: [release-linux, release-windows]
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'develop')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Linux release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-linux.outputs.basename }}
          path: dist/release

      - name: Download Windows release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-windows.outputs.basename }}
          path: dist/release

      - name: Move channel tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ needs.release-linux.outputs.release-tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ needs.release-linux.outputs.release-tag }}" --force

      - name: Publish channel release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ needs.release-linux.outputs.release-tag }}"
          title="${{ needs.release-linux.outputs.release-name }}"
          linux_asset="dist/release/${{ needs.release-linux.outputs.basename }}.zip"
          windows_asset="dist/release/${{ needs.release-windows.outputs.basename }}.zip"

          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "${{ needs.release-linux.outputs.prerelease }}" == "true" ]]; then
              gh release edit "$tag" --title "$title" --prerelease --latest=false
            else
              gh release edit "$tag" --title "$title" --latest=false
            fi
          else
            if [[ "${{ needs.release-linux.outputs.prerelease }}" == "true" ]]; then
              gh release create "$tag" --title "$title" --prerelease --latest=false --target "$GITHUB_SHA"
            else
              gh release create "$tag" --title "$title" --latest=false --target "$GITHUB_SHA"
            fi
          fi

          gh release upload "$tag" "$linux_asset" "$windows_asset" --clobber
