sonar.projectKey=Custom-Fakelag
sonar.projectName=Custom-Fakelag
sonar.sourceEncoding=UTF-8
sonar.sources=extension,diagnostics/steam_lifecycle_debug,scripts
sonar.exclusions=**/__pycache__/**,extension/libudis86/**,extension/asm/**,diagnostics/**/tests.cpp
# Plugin comunitario sonar-cxx, distinto de SonarCFamily.
sonar.cxx.file.suffixes=.c,.cc,.cpp,.cxx,.h,.hh,.hpp,.hxx
# A parser error must fail analysis instead of publishing partial C++ metrics.
sonar.cxx.errorRecoveryEnabled=false

# SourcePawn .inc files are not PHP; retain only the actual PHP suffix.
sonar.php.file.suffixes=.php
